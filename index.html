<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Test Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Mock Test Portal</h1>
    </header>

    <main class="dashboard-card">
      <div class="controls-grid">
        <div class="input-group">
          <label for="mode-select">Category</label>
          <select id="mode-select">
            <option value="mocks">Mock Test</option>
            <option value="notes">Notes</option>
          </select>
        </div>

        <div class="input-group">
          <label for="exam-select">Exam</label>
          <select id="exam-select"></select>
        </div>

        <div class="input-group">
          <label for="level-select">Level / Paper</label>
          <select id="level-select"></select>
        </div>

        <div class="input-group">
          <label for="test-num">Test No.</label>
          <input type="number" id="test-num" value="1" min="1">
        </div>

        <button id="load-btn" class="btn-primary">Load Content</button>
      </div>

      <div id="display-container" class="display-area">
        <p class="placeholder-text">Select exam details above to start.</p>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
