<svg xmlns="http://w3.org/2000/svg" viewBox="0 0 850 580" width="100%" height="100%">
  <!-- Definitions for Gradients, Glows, and Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="photon-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C" />
    </marker>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cathodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <style>
    .text-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .text-subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4B5563; font-style: italic; }
    .text-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .text-sub { font-size: 11px; fill: #64748B; font-weight: normal; }
    .text-bold { font-weight: bold; }
    .wire { fill: none; stroke: #334155; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background Canvas Accent -->
  <rect width="850" height="580" fill="#FBFBFB" rx="12"/>

  <!-- Main Title -->
  <text x="425" y="40" class="text-title" text-anchor="middle">Phototube Detector</text>
  <text x="425" y="60" class="text-subtitle" text-anchor="middle">(Photoemissive Tube Detector)</text>

  <!-- ================= VACUUM GLASS TUBE ================= -->
  <!-- Outer Glass Envelope -->
  <rect x="260" y="120" width="220" height="240" rx="40" fill="url(#glassGrad)" stroke="#64748B" stroke-width="2.5" />
  <text x="470" y="310" class="text-label text-sub" fill="#64748B">Evacuated Glass Tube</text>

  <!-- ================= INTERNAL ELECTRODES ================= -->
  
  <!-- Photocathode (Curved Photosensitive Plate) -->
  <path d="M 300 160 Q 340 240 300 320" fill="none" stroke="url(#cathodeGrad)" stroke-width="6" stroke-linecap="round" />
  <!-- Cathode Support/Wire Connection -->
  <path d="M 318 240 L 340 240 L 340 360" fill="none" stroke="#475569" stroke-width="2" />
  
  <!-- Anode (Central Collector Wire/Rod) -->
  <line x1="410" y1="160" x2="410" y2="320" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
  <!-- Anode Connection Wire out of tube -->
  <path d="M 410 320 L 410 360" fill="none" stroke="#475569" stroke-width="2" />


  <!-- ================= RADIATION & ELECTRON FLOW ================= -->
  
  <!-- Incoming Light Rays (Photons) -->
  <g id="incoming-photons">
    <path d="M 560 140 L 335 210" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="1,1" marker-end="url(#photon-arrow)" />
    <path d="M 570 165 L 332 245" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="1,1" marker-end="url(#photon-arrow)" />
    <path d="M 580 190 L 335 280" fill="none" stroke="#EA580C" stroke-width="2" stroke-dasharray="1,1" marker-end="url(#photon-arrow)" />
    <text x="585" y="170" class="text-label text-bold" fill="#EA580C">Light Rays (Photons)</text>
  </g>

  <!-- Released Photoelectrons (Emitted from Cathode to Anode) -->
  <g id="photoelectrons">
    <path d="M 325 210 L 395 195" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#electron-arrow)" />
    <path d="M 328 245 L 398 240" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#electron-arrow)" />
    <path d="M 325 275 L 395 285" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#electron-arrow)" />
    <text x="360" y="178" class="text-label text-sub" fill="#EF4444" text-anchor="middle">e⁻</text>
    <text x="370" y="225" class="text-label text-sub" fill="#EF4444" text-anchor="middle">e⁻</text>
    <text x="360" y="305" class="text-label text-sub" fill="#EF4444" text-anchor="middle">e⁻</text>
    <text x="460" y="215" class="text-label text-sub text-bold" fill="#EF4444">Released Electrons</text>
  </g>


  <!-- ================= EXTERNAL CIRCUIT ================= -->
  
  <!-- Left Side: Cathode connection to Negative Terminal -->
  <path d="M 340 360 L 340 450 L 380 450" class="wire" />
  
  <!-- Right Side: Anode connection to Positive Terminal via Display -->
  <path d="M 410 360 L 410 450 L 440 450" class="wire" />
  
  <!-- DC Power Supply (Battery) -->
  <!-- Negative Plate (Cathode Side) -->
  <line x1="380" y1="435" x2="380" y2="465" stroke="#DC2626" stroke-width="3" />
  <text x="375" y="425" class="text-label text-bold" fill="#DC2626">-</text>
  
  <!-- Positive Plate (Anode Side) -->
  <line x1="390" y1="442" x2="390" y2="458" stroke="#1D4ED8" stroke-width="5" />
  <line x1="400" y1="435" x2="400" y2="465" stroke="#DC2626" stroke-width="3" />
  <line x1="410" y1="442" x2="410" y2="458" stroke="#1D4ED8" stroke-width="5" />
  <line x1="420" y1="435" x2="420" y2="465" stroke="#DC2626" stroke-width="3" />
  <line x1="430" y1="442" x2="430" y2="458" stroke="#1D4ED8" stroke-width="5" />
  <line x1="440" y1="435" x2="440" y2="465" stroke="#DC2626" stroke-width="3" />
  <text x="445" y="425" class="text-label text-bold" fill="#1D4ED8">+</text>

  <!-- Connection from Battery to Display Meter -->
  <path d="M 440 450 L 520 450" class="wire" />

  <!-- Display / Output Meter Indicator -->
  <g id="display-meter">
    <circle cx="550" cy="450" r="22" fill="#FFFFFF" stroke="#059669" stroke-width="2.5" />
    <!-- Meter Pointer -->
    <path d="M 550 465 L 562 440" fill="none" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Display Screen representation -->
    <path d="M 538 442 Q 550 436 562 442" fill="none" stroke="#64748B" stroke-width="1.5" />
    <text x="590" y="455" class="text-label" fill="#059669">Display / Meter</text>
  </g>


  <!-- ================= LABELS & POINTER LINES ================= -->
  
  <!-- Photocathode Label -->
  <path d="M 160 210 L 250 210 L 290 225" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arrow)" />
  <text x="150" y="205" class="text-label" text-anchor="end" fill="#1D4ED8">Photocathode</text>
  <text x="150" y="222" class="text-sub" text-anchor="end">(Coated with Cesium / Silver Oxide)</text>

  <!-- Anode Label -->
  <path d="M 180 280 L 260 280 L 400 255" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#arrow)" />
  <text x="170" y="275" class="text-label" text-anchor="end" fill="#1E293B">Anode</text>
  <text x="170" y="292" class="text-sub" text-anchor="end">(Collector Rod)</text>

  <!-- Core Principle Note Box -->
  <rect x="230" y="500" width="390" height="50" fill="#F1F5F9" stroke="#CBD5E0" rx="6" />
  <text x="425" y="522" class="text-label text-sub text-bold" text-anchor="middle" fill="#334155">Principle: 1 Photon In ➔ 1 Electron Out</text>
  <text x="425" y="538" class="text-sub" text-anchor="middle" fill="#64748B">(Works on Photoemissive Effect without Dynodes)</text>

</svg>
