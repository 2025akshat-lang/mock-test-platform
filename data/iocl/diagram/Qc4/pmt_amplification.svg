<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <!-- Definitions for Gradients, Glows, and Markers -->
  <defs>
    <!-- Photon (Light) Arrow Marker -->
    <marker id="photon-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    
    <!-- Electron Arrow Marker -->
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#EF4444" />
    </marker>

    <!-- Glass Envelope Gradient -->
    <linearGradient id="glassTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dynode Metallic Gradient -->
    <linearGradient id="dynodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4B5563; font-style: italic; }
    .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .sub-label { font-size: 11px; fill: #64748B; font-weight: normal; }
    .voltage-tag { font-family: monospace; font-size: 11px; fill: #2563EB; font-weight: bold; }
    .ray-electron { stroke: #EF4444; stroke-dasharray: 3,2; fill: none; }
  </style>

  <!-- Background Accent -->
  <rect width="900" height="580" fill="#FCFCFC" rx="12"/>

  <!-- Main Title -->
  <text x="450" y="40" class="title" text-anchor="middle">Photomultiplier Tube (PMT) Internal Amplification</text>
  <text x="450" y="60" class="subtitle" text-anchor="middle">Mechanism of Secondary Electron Emission &amp; Electron Cascade</text>

  <!-- ================= 1. VACUUM GLASS ENVELOPE ================= -->
  <rect x="120" y="100" width="660" height="260" rx="30" fill="url(#glassTube)" stroke="#64748B" stroke-width="2.5" />
  <text x="760" y="345" class="label sub-label" text-anchor="end">Evacuated Glass Envelope (Vacuum)</text>

  <!-- ================= 2. PHOTOCATHODE ================= -->
  <!-- Photoemissive Surface -->
  <path d="M 160 130 Q 185 230 160 330" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" />
  <text x="145" y="365" class="label" text-anchor="middle" fill="#2563EB">Photocathode</text>
  <text x="145" y="380" class="sub-label" text-anchor="middle">(Light Sensitive Surface)</text>

  <!-- ================= 3. INCOMING WEAK LIGHT (PHOTON) ================= -->
  <path d="M 30 220 Q 60 190 90 220 T 150 220" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#photon-arrow)" />
  <text x="25" y="185" class="label" fill="#D97706">Incoming Photon</text>
  <text x="25" y="200" class="sub-label">(Low Light Intensity)</text>

  <!-- ================= 4. DYNODE CHAIN (Curved Plates at Specific Angles) ================= -->
  <!-- Top Dynodes (1, 3, 5, 7) -->
  <path id="d1" d="M 230 150 Q 255 110 280 150" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />
  <path id="d3" d="M 370 150 Q 395 110 420 150" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />
  <path id="d5" d="M 510 150 Q 535 110 560 150" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />
  <path id="d7" d="M 650 150 Q 675 110 700 150" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Bottom Dynodes (2, 4, 6) -->
  <path id="d2" d="M 300 310 Q 325 350 350 310" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />
  <path id="d4" d="M 440 310 Q 465 350 490 310" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />
  <path id="d6" d="M 580 310 Q 605 350 630 310" fill="none" stroke="url(#dynodeGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Dynode Labels & Progressive Voltages -->
  <text x="255" y="105" class="label sub-label text-bold" text-anchor="middle">Dynode 1 <tspan class="voltage-tag">(+100V)</tspan></text>
  <text x="325" y="375" class="label sub-label text-bold" text-anchor="middle">Dynode 2 <tspan class="voltage-tag">(+200V)</tspan></text>
  <text x="395" y="105" class="label sub-label text-bold" text-anchor="middle">Dynode 3 <tspan class="voltage-tag">(+300V)</tspan></text>
  <text x="465" y="375" class="label sub-label text-bold" text-anchor="middle">Dynode 4 <tspan class="voltage-tag">(+400V)</tspan></text>
  <text x="535" y="105" class="label sub-label text-bold" text-anchor="middle">Dynode 5 <tspan class="voltage-tag">(+500V)</tspan></text>
  <text x="605" y="375" class="label sub-label text-bold" text-anchor="middle">Dynode 6 <tspan class="voltage-tag">(+600V)</tspan></text>
  <text x="675" y="105" class="label sub-label text-bold" text-anchor="middle">Dynode 7 <tspan class="voltage-tag">(+700V)</tspan></text>

  <!-- ================= 5. ANODE (COLLECTOR) ================= -->
  <line x1="740" y1="160" x2="740" y2="300" stroke="#DC2626" stroke-width="5" stroke-linecap="round" />
  <text x="755" y="225" class="label" fill="#DC2626">Anode</text>
  <text x="755" y="240" class="sub-label" fill="#DC2626">(Collector, +800V)</text>

  <!-- ================= 6. ELECTRON CASCADING PATHWAYS ================= -->
  <!-- 1. Photoelectron emitted from Photocathode to Dynode 1 -->
  <path d="M 175 220 Q 210 190 245 145" class="ray-electron" stroke-width="1.5" marker-end="url(#electron-arrow)" />
  <text x="195" y="175" class="label sub-label text-bold" fill="#EF4444">Primary Electron</text>
  
  <!-- 2. Dynode 1 to Dynode 2 (Multiplication Starts) -->
  <path d="M 255 145 Q 275 220 315 312" class="ray-electron" stroke-width="1.8" marker-end="url(#electron-arrow)" />
  <path d="M 260 148 Q 285 225 325 310" class="ray-electron" stroke-width="1.8" />
  <text x="260" y="230" class="label sub-label" fill="#EF4444">Secondary Emission</text>

  <!-- 3. Dynode 2 to Dynode 3 -->
  <path d="M 325 310 L 385 148" class="ray-electron" stroke-width="2.2" />
  <path d="M 330 310 L 392 146" class="ray-electron" stroke-width="2.2" marker-end="url(#electron-arrow)" />
  <path d="M 335 312 L 400 148" class="ray-electron" stroke-width="2.2" />

  <!-- 4. Dynode 3 to Dynode 4 -->
  <path d="M 395 148 L 455 310" class="ray-electron" stroke-width="2.5" />
  <path d="M 400 148 L 462 310" class="ray-electron" stroke-width="2.5" marker-end="url(#electron-arrow)" />
  <path d="M 405 148 L 470 310" class="ray-electron" stroke-width="2.5" />
  <path d="M 410 148 L 478 310" class="ray-electron" stroke-width="2.5" />

  <!-- 5. Dynode 4 to Dynode 5 (Thicker/Denser Representation) -->
  <path d="M 465 310 L 525 148 M 470 310 L 532 148 M 475 310 L 540 148 M 480 310 L 548 148" class="ray-electron" stroke-width="2.8" />
  
  <!-- 6. Dynode 5 to Dynode 6 -->
  <path d="M 535 148 L 595 310 M 540 148 L 602 310 M 545 148 L 610 310 M 550 148 L 618 310" class="ray-electron" stroke-width="3" />

  <!-- 7. Dynode 6 to Dynode 7 -->
  <path d="M 605 310 L 665 148 M 610 310 L 672 148 M 615 310 L 680 148 M 620 310 L 688 148" class="ray-electron" stroke-width="3.2" />

  <!-- 8. Final Massive Avalanche from Dynode 7 to Anode -->
  <path d="M 675 148 L 735 200 M 678 150 L 735 220 M 682 152 L 735 240 M 685 155 L 735 260 M 690 158 L 735 280" class="ray-electron" stroke-width="3.5" marker-end="url(#electron-arrow)" />
  
  <text x="640" y="230" class="label text-bold" fill="#EF4444" text-anchor="middle">Electron Avalanche</text>
  <text x="640" y="245" class="sub-label" fill="#EF4444" text-anchor="middle">(1 Photon &#x279C; 10&#x2076; to 10&#x2077; Electrons)</text>

  <!-- ================= 7. VOLTAGE DIVIDER CIRCUIT LINE ================= -->
  <path d="M 160 335 L 160 440 L 740 440 L 740 305" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="450" y="465" class="label sub-label text-bold" text-anchor="middle" fill="#475569">High Voltage Reference Chain (Progressive Potentials Grid)</text>
</svg>
