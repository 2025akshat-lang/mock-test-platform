<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <!-- Definitions for Gradients, Patterns, and Markers -->
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563" />
    </marker>

    <!-- Liquid Flow Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Guard Column Stationary Phase (Sacrificial/Trapping) -->
    <pattern id="guardPacking" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#EF4444" opacity="0.7"/>
      <circle cx="7" cy="7" r="1.5" fill="#F59E0B" opacity="0.6"/>
    </pattern>

    <!-- Main Column Stationary Phase (Analytical) -->
    <pattern id="mainPacking" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#10B981" opacity="0.8"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .sub-label { font-size: 11px; fill: #64748B; font-weight: normal; }
    .flow-line { fill: none; stroke: url(#flowGrad); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .flow-arrow { fill: none; stroke: #2563EB; stroke-width: 2; }
  </style>

  <!-- Background Accent -->
  <rect width="850" height="500" fill="#FAFAFA" rx="12"/>

  <!-- Main Title -->
  <text x="425" y="45" class="title" text-anchor="middle">Role of Guard Column in HPLC Setup</text>

  <!-- ================= 1. FLOW PATHWAY (TUBING) ================= -->
  <!-- From Injector -> Guard -> Main -> Detector -->
  <path d="M 50 220 L 170 220 M 260 220 L 350 220 M 600 220 L 720 220" class="flow-line" />
  
  <!-- Flow Direction Indicators -->
  <path d="M 80 220 L 100 220" class="flow-arrow" marker-end="url(#arrow)" />
  <path d="M 290 220 L 310 220" class="flow-arrow" marker-end="url(#arrow)" />
  <path d="M 640 220 L 660 220" class="flow-arrow" marker-end="url(#arrow)" />

  <text x="90" y="195" class="label sub-label text-bold" fill="#2563EB" text-anchor="middle">Mobile Phase + Sample</text>

  <!-- ================= 2. SAMPLE INJECTOR / PUMP INPUT (Left Context) ================= -->
  <g id="input-source">
    <rect x="20" y="180" width="30" height="80" fill="#E2E8F0" stroke="#475569" stroke-width="2" rx="4" />
    <text x="35" y="275" class="label sub-label" text-anchor="middle">From</text>
    <text x="35" y="290" class="label sub-label text-bold" text-anchor="middle">Injector</text>
  </g>


  <!-- ================= 3. GUARD COLUMN (Pre-Column) ================= -->
  <g id="guard-column">
    <!-- Outer Body -->
    <rect x="170" y="185" width="90" height="70" fill="#FFF" stroke="#EF4444" stroke-width="3" rx="6" />
    <!-- End Fittings -->
    <rect x="162" y="200" width="8" height="40" fill="#94A3B8" stroke="#475569" />
    <rect x="260" y="200" width="8" height="40" fill="#94A3B8" stroke="#475569" />
    <!-- Stationary Phase Packing with Trapped Contaminants -->
    <rect x="173" y="188" width="84" height="64" fill="url(#guardPacking)" rx="4" />
    
    <!-- Labels -->
    <text x="215" y="150" class="label" fill="#DC2626" text-anchor="middle">Guard Column</text>
    <text x="215" y="168" class="label sub-label text-bold" text-anchor="middle">(Pre-Column: 2-10 cm)</text>
  </g>

  <!-- Highlighting Function of Guard Column -->
  <g id="trap-pointer">
    <path d="M 215 230 L 215 320 L 170 320" fill="none" stroke="#EF4444" stroke-width="1" marker-end="url(#arrow)" />
    <text x="160" y="315" class="label sub-label text-bold" fill="#B91C1C" text-anchor="end">Traps Strongly Bound Impurities</text>
    <text x="160" y="330" class="sub-label" text-anchor="end">&amp; Particulate Matter (Garbage)</text>
  </g>


  <!-- ================= 4. MAIN ANALYTICAL COLUMN ================= -->
  <g id="main-column">
    <!-- Outer Body (Longer length) -->
    <rect x="350" y="185" width="250" height="70" fill="#FFF" stroke="#10B981" stroke-width="3" rx="6" />
    <!-- End Fittings -->
    <rect x="342" y="200" width="8" height="40" fill="#94A3B8" stroke="#475569" />
    <rect x="600" y="200" width="8" height="40" fill="#94A3B8" stroke="#475569" />
    <!-- Pure Packing Material -->
    <rect x="353" y="188" width="244" height="64" fill="url(#mainPacking)" rx="4" />
    
    <!-- Labels -->
    <text x="475" y="150" class="label" fill="#059669" text-anchor="middle">Main Analytical Column</text>
    <text x="475" y="168" class="label sub-label text-bold" text-anchor="middle">(Protected &amp; Clean, 10-30 cm)</text>
  </g>

  <!-- Highlighting Function of Main Column -->
  <g id="clean-pointer">
    <path d="M 475 235 L 475 320 L 520 320" fill="none" stroke="#10B981" stroke-width="1" marker-end="url(#arrow)" />
    <text x="530" y="315" class="label sub-label text-bold" fill="#047857">Performs Core Separation</text>
    <text x="530" y="330" class="sub-label">Free from Stripping &amp; Contamination</text>
  </g>


  <!-- ================= 5. DETECTOR OUTPUT (Right Context) ================= -->
  <g id="detector-target">
    <rect x="720" y="180" width="30" height="80" fill="#E2E8F0" stroke="#475569" stroke-width="2" rx="4" />
    <text x="735" y="275" class="label sub-label" text-anchor="middle">To</text>
    <text x="735" y="290" class="label sub-label text-bold" text-anchor="middle">Detector</text>
  </g>

  <!-- ================= CORE SUMMARY BOX ================= -->
  <rect x="180" y="400" width="490" height="50" fill="#F1F5F9" stroke="#CBD5E0" stroke-width="1.5" rx="6" />
  <text x="425" y="422" class="label sub-label text-bold" fill="#1F2937" text-anchor="middle">Primary Function: Protects the expensive analytical column from stripping</text>
  <text x="425" y="438" class="sub-label" fill="#4B5563" text-anchor="middle">problems and irreversible adsorption of impurities.</text>

</svg>
