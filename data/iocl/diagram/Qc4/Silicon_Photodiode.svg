<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%">
  <!-- Definitions for Gradients, Glows, and Markers -->
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563" />
    </marker>
    
    <!-- Photon Light Arrow -->
    <marker id="photon-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>

    <!-- Semiconductor Layer Gradients -->
    <linearGradient id="pLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="nLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="depletionZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4B5563; font-style: italic; }
    .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .sub-label { font-size: 11px; fill: #64748B; font-weight: normal; }
    .text-bold { font-weight: bold; }
    .wire { fill: none; stroke: #374151; stroke-width: 2.5; stroke-linecap: round; }
    .sign-plus { fill: #1D4ED8; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; }
    .sign-minus { fill: #B91C1C; font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; }
  </style>

  <!-- Background Canvas Accent -->
  <rect width="850" height="540" fill="#FAFAFA" rx="12"/>

  <!-- Main Title -->
  <text x="425" y="45" class="title" text-anchor="middle">Silicon Photodiode Detector (Solid-State)</text>
  <text x="425" y="65" class="subtitle" text-anchor="middle">Direct Photon-to-Current Conversion via P-N Junction (No High Voltage Needed)</text>

  <!-- ================= LIGHT ENERGY (PHOTONS) ================= -->
  <g id="light-input" transform="translate(130, 0)">
    <path d="M 220 90 L 220 155" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#photon-arrow)" />
    <path d="M 270 90 L 270 155" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#photon-arrow)" />
    <path d="M 320 90 L 320 155" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#photon-arrow)" />
    <text x="270" y="80" class="label" fill="#D97706" text-anchor="middle">Incoming Light Wavelength (hν)</text>
  </g>


  <!-- ================= SEMICONDUCTOR SOLID-STATE DIODE ================= -->
  <!-- Anti-Reflective Coating / Top Window -->
  <rect x="250" y="160" width="300" height="10" fill="#22D3EE" opacity="0.6" stroke="#0891B2" stroke-width="1"/>
  <text x="560" y="168" class="sub-label">Anti-Reflective Window</text>

  <!-- P-Type Silicon Layer (Thin Top Layer) -->
  <rect x="250" y="170" width="300" height="30" fill="url(#pLayer)" stroke="#1D4ED8" stroke-width="1.5" />
  <text x="265" y="190" class="label" fill="#1E3A8A">P-type Layer (Holes)</text>
  <text x="430" y="190" class="sign-plus">+</text><text x="470" y="190" class="sign-plus">+</text><text x="510" y="190" class="sign-plus">+</text>

  <!-- Depletion Region / Junction (Where EHP Generation occurs) -->
  <rect x="250" y="200" width="300" height="45" fill="url(#depletionZone)" stroke="#94A3B8" stroke-width="1" />
  <text x="265" y="226" class="label" fill="#475569">Depletion Region</text>
  
  <!-- Electron-Hole Pair (EHP) Generation Visual -->
  <g id="ehp-generation" transform="translate(420, 205)">
    <circle cx="20" cy="15" r="5" fill="none" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="17" y="19" font-size="10" class="sign-plus">+</text>
    <line x1="25" y1="15" x2="45" y2="15" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="50" cy="15" r="5" fill="#B91C1C"/>
    <text x="48" y="18" font-size="10" fill="#FFF" font-weight="bold">-</text>
    <text x="35" y="34" class="sub-label text-bold" fill="#059669" text-anchor="middle">Photon Absorption ➔ EHP Created</text>
  </g>

  <!-- N-Type Silicon Layer (Thick Substrate) -->
  <rect x="250" y="245" width="300" height="65" fill="url(#nLayer)" stroke="#B91C1C" stroke-width="1.5" />
  <text x="265" y="285" class="label" fill="#7F1D1D">N-type Layer (Electrons)</text>
  <text x="430" y="285" class="sign-minus">-</text><text x="470" y="285" class="sign-minus">-</text><text x="510" y="285" class="sign-minus">-</text>


  <!-- ================= UNPOWERED MEASUREMENT CIRCUIT ================= -->
  <!-- Top Anode Connection Contact -->
  <rect x="385" y="165" width="20" height="5" fill="#475569" />
  <path d="M 395 165 L 395 130 L 150 130 L 150 360 L 320 360" class="wire" />
  
  <!-- Bottom Cathode Connection Contact -->
  <rect x="385" y="310" width="20" height="5" fill="#475569" />
  <path d="M 395 315 L 395 360 L 380 360" class="wire" />

  <!-- Zero-Bias Microammeter / Photocurrent Readout (No External Power Supply) -->
  <g id="ammeter" transform="translate(350, 360)">
    <circle cx="0" cy="0" r="30" fill="#FFF" stroke="#059669" stroke-width="3" />
    <!-- Pointer indicating generated current directly -->
    <path d="M 0 20 L 12 -12" fill="none" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">μA</text>
    
    <text x="0" y="48" class="label" fill="#059669" text-anchor="middle">Photocurrent Meter</text>
    <text x="0" y="63" class="sub-label" text-anchor="middle">(Direct Readout)</text>
  </g>


  <!-- ================= LABELS & HIGHLIGHTS ================= -->
  
  <!-- Zero External Power Highlight -->
  <g id="no-battery-note" transform="translate(590, 340)">
    <rect width="210" height="65" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" rx="6" />
    <circle cx="25" cy="32" r="12" fill="#EF4444" />
    <line x1="18" y1="32" x2="32" y2="32" stroke="#FFF" stroke-width="3"/>
    <text x="48" y="28" class="label" fill="#991B1B" font-size="13">NO External High</text>
    <text x="48" y="45" class="label" fill="#991B1B" font-size="13">Voltage Required</text>
  </g>

  <!-- Core Summary Rule Box -->
  <rect x="120" y="460" width="610" height="50" fill="#F1F5F9" stroke="#CBD5E0" stroke-width="1.5" rx="6" />
  <text x="425" y="482" class="label sub-label text-bold" fill="#1F2937" text-anchor="middle">Key Distinction: Unlike PMTs or Vacuum Phototubes, Silicon Photodiodes utilize internal</text>
  <text x="425" y="498" class="sub-label" fill="#4B5563" text-anchor="middle">solid-state p-n junctions to directly convert light energy into current with zero high-voltage bias.</text>

</svg>
