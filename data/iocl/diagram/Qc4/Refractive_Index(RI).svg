<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%">
  <!-- Definitions for Arrows and Gradients -->
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563" />
    </marker>

    <!-- Gradient representing Mobile Phase Change (Gradient Elution) -->
    <linearGradient id="solventGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/> <!-- Solvent A -->
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/> <!-- Solvent B -->
    </linearGradient>

    <!-- Constant Gradient (Isocratic Elution) -->
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4B5563; font-style: italic; }
    .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .sub-label { font-size: 11px; fill: #64748B; font-weight: normal; }
    .graph-bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
    .axis { stroke: #475569; stroke-width: 2; fill: none; }
    .curve-stable { stroke: #10B981; stroke-width: 3; fill: none; stroke-linecap: round; }
    .curve-drift { stroke: #EF4444; stroke-width: 3; fill: none; stroke-linecap: round; }
  </style>

  <!-- Background Accent -->
  <rect width="850" height="540" fill="#FAFAFA" rx="12"/>

  <!-- Main Title -->
  <text x="425" y="40" class="title" text-anchor="middle">Constraint of RI Detector in Gradient Elution</text>
  <text x="425" y="60" class="subtitle" text-anchor="middle">Why Refractive Index Detectors Fail with Changing Mobile Phase</text>

  <!-- ================= 1. ISOCRATIC ELUTION GRAPH (Ideal Case) ================= -->
  <g id="isocratic-graph" transform="translate(80, 120)">
    <!-- Graph Area -->
    <rect width="300" height="180" class="graph-bg" rx="6" />
    
    <!-- Solvent Visual Bar (Constant Color) -->
    <rect x="0" y="0" width="300" height="15" fill="url(#isoGrad)" rx="2"/>
    <text x="150" y="11" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle">Constant Mobile Phase Composition</text>

    <!-- Axes -->
    <path d="M 30 20 L 30 150 L 280 150" class="axis" marker-end="url(#arrow)" />
    <path d="M 30 150 L 30 20" class="axis" marker-end="url(#arrow)" />

    <!-- Labels -->
    <text x="285" y="165" class="label sub-label text-bold" text-anchor="end">Time</text>
    <text x="15" y="85" class="label sub-label text-bold" text-anchor="middle" transform="rotate(-90, 15, 85)">RI Signal</text>
    
    <!-- Stable Chromatogram Baseline -->
    <path d="M 30 110 L 90 110 Q 110 40 120 40 Q 130 40 150 110 L 190 110 Q 210 20 220 20 Q 230 20 250 110 L 270 110" class="curve-stable" />
    
    <!-- Graph Title -->
    <text x="150" y="210" class="label" fill="#059669" text-anchor="middle">A. Isocratic Elution</text>
    <text x="150" y="225" class="sub-label" text-anchor="middle">Stable Baseline (No Composition Change)</text>
  </g>


  <!-- ================= 2. GRADIENT ELUTION GRAPH (The Problem) ================= -->
  <g id="gradient-graph" transform="translate(470, 120)">
    <!-- Graph Area -->
    <rect width="300" height="180" class="graph-bg" rx="6" />
    
    <!-- Solvent Visual Bar (Changing Color) -->
    <rect x="0" y="0" width="300" height="15" fill="url(#solventGrad)" rx="2"/>
    <text x="150" y="11" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle">Changing Mobile Phase (Solvent A → B)</text>

    <!-- Axes -->
    <path d="M 30 20 L 30 150 L 280 150" class="axis" marker-end="url(#arrow)" />
    <path d="M 30 150 L 30 20" class="axis" marker-end="url(#arrow)" />

    <!-- Labels -->
    <text x="285" y="165" class="label sub-label text-bold" text-anchor="end">Time</text>
    <text x="15" y="85" class="label sub-label text-bold" text-anchor="middle" transform="rotate(-90, 15, 85)">RI Signal</text>
    
    <!-- Drifting Chromatogram Baseline -->
    <!-- The line continually rises as the bulk refractive index changes -->
    <path d="M 30 130 L 70 120 Q 90 50 100 50 Q 110 50 130 110 L 170 95 Q 190 10 200 10 Q 210 10 230 75 L 270 60" class="curve-drift" />
    
    <!-- Baseline Drift Arrow Indicator -->
    <path d="M 60 142 L 250 82" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
    <text x="160" y="130" class="label sub-label text-bold" fill="#B91C1C" text-anchor="middle" transform="rotate(-17, 160, 130)">Severe Baseline Drift</text>

    <!-- Graph Title -->
    <text x="150" y="210" class="label" fill="#DC2626" text-anchor="middle">B. Gradient Elution</text>
    <text x="150" y="225" class="sub-label" text-anchor="middle">Unstable Baseline (Bulk Property Shifts)</text>
  </g>


  <!-- ================= CORE MECHANISM BOX ================= -->
  <rect x="100" y="420" width="650" height="70" fill="#F1F5F9" stroke="#CBD5E0" stroke-width="1.5" rx="8" />
  <text x="425" y="445" class="label text-bold" fill="#1E293B" text-anchor="middle">Scientific Reason:</text>
  <text x="425" y="465" class="sub-label text-bold" fill="#334155" text-anchor="middle">Refractive Index (RI) is a Bulk Property. When the solvent composition shifts continuously,</text>
  <text x="425" y="480" class="sub-label" fill="#4B5563" text-anchor="middle">the background RI changes drastically, making it impossible to establish a flat baseline.</text>

</svg>
