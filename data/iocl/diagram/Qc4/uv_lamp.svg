<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 780" width="100%" height="100%">
  <defs>
    <!-- Filter effects for different light emissions -->
    <filter id="glow-tungsten" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-deuterium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-led" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-xenon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Light Path Gradients -->
    <linearGradient id="grad-tungsten" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-deuterium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-led" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-xenon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .main-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1E3A8A; }
    .section-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 8px; }
    .lamp-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1F2937; }
    .spec-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #4B5563; }
    .spec-bold { font-weight: bold; fill: #111827; }
    .outline { stroke: #374151; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .ray-line { stroke-width: 1.5; stroke-dasharray: 3,3; }
  </style>

  <!-- Background Canvas -->
  <rect width="950" height="780" fill="#F8FAFC" rx="16"/>

  <!-- Main Dashboard Title -->
  <text x="475" y="45" class="main-title" text-anchor="middle">Comparison of Spectroscopy Light Sources</text>

  <!-- ========================================================================= -->
  <!-- 1. TUNGSTEN HALOGEN LAMP (Top Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 80)">
    <rect width="410" height="300" class="section-bg"/>
    <text x="20" y="35" class="lamp-title">1. Tungsten-Halogen Lamp</text>
    
    <!-- Light Beam Output -->
    <polygon points="175,140 360,100 360,200 175,160" fill="url(#grad-tungsten)"/>
    <line x1="175" y1="140" x2="360" y2="100" stroke="#F59E0B" class="ray-line"/>
    <line x1="175" y1="160" x2="360" y2="200" stroke="#F59E0B" class="ray-line"/>

    <!-- Lamp Graphic Structure -->
    <circle cx="130" cy="150" r="30" fill="#FEF08A" opacity="0.3" filter="url(#glow-tungsten)"/>
    <!-- Quartz Bulb Envelope -->
    <path d="M 100 120 C 100 90, 160 90, 160 120 C 160 145, 140 155, 140 175 L 120 175 C 120 155, 100 145, 100 120 Z" fill="#FFFFFF" fill-opacity="0.4" stroke="#4B5563" stroke-width="2"/>
    <rect x="120" y="175" width="20" height="15" fill="#94A3B8" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Internal Filament Structure -->
    <line x1="123" y1="130" x2="123" y2="175" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="137" y1="130" x2="137" y2="175" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Filament Coil -->
    <path d="M 123 130 Q 126 122, 130 130 Q 134 138, 137 130" fill="none" stroke="#EF4444" stroke-width="2.5"/>

    <!-- Specifications Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="spec-text"><tspan class="spec-bold">Spectral Range:</tspan> 350 nm – 3000 nm</text>
      <text x="0" y="20" class="spec-text"><tspan class="spec-bold">Region Covered:</tspan> Visible to Near-Infrared (NIR)</text>
      <text x="0" y="40" class="spec-text"><tspan class="spec-bold">Mechanism:</tspan> Thermal Blackbody Radiation (Heated Filament)</text>
      <text x="0" y="60" class="spec-text"><tspan class="spec-bold">Key Trait:</tspan> Very stable output, long operational life</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. DEUTERIUM DISCHARGE LAMP (Top Right) -->
  <!-- ========================================================================= -->
  <g transform="translate(500, 80)">
    <rect width="410" height="300" class="section-bg"/>
    <text x="20" y="35" class="lamp-title">2. Deuterium (D₂) Lamp</text>
    
    <!-- UV Light Beam Output -->
    <polygon points="190,140 360,100 360,200 190,160" fill="url(#grad-deuterium)"/>
    <line x1="190" y1="140" x2="360" y2="100" stroke="#8B5CF6" class="ray-line"/>
    <line x1="190" y1="160" x2="360" y2="200" stroke="#8B5CF6" class="ray-line"/>

    <!-- Lamp Graphic Structure -->
    <circle cx="130" cy="150" r="35" fill="#C084FC" opacity="0.25" filter="url(#glow-deuterium)"/>
    <!-- Cylindrical Glass/Quartz Body -->
    <rect x="90" y="95" width="80" height="110" rx="15" fill="#FFFFFF" fill-opacity="0.3" stroke="#4B5563" stroke-width="2"/>
    <rect x="115" y="205" width="30" height="12" fill="#94A3B8" stroke="#4B5563"/>
    <!-- Internal Arc Block -->
    <rect x="115" y="120" width="30" height="60" rx="3" fill="#E2E8F0" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Concentrated Plasma Discharge Core Slot -->
    <circle cx="135" cy="150" r="7" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>

    <!-- Specifications Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="spec-text"><tspan class="spec-bold">Spectral Range:</tspan> 160 nm – 375 nm</text>
      <text x="0" y="20" class="spec-text"><tspan class="spec-bold">Region Covered:</tspan> Ultraviolet (UV Region)</text>
      <text x="0" y="40" class="spec-text"><tspan class="spec-bold">Mechanism:</tspan> Electric Arc Molecular Dissociation in D₂ Gas</text>
      <text x="0" y="60" class="spec-text"><tspan class="spec-bold">Key Trait:</tspan> Requires Quartz glass envelope (blocks UV absorption)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. LIGHT EMITTING DIODE - LED (Bottom Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 420)">
    <rect width="410" height="300" class="section-bg"/>
    <text x="20" y="35" class="lamp-title">3. Light Emitting Diode (LED)</text>
    
    <!-- LED Directed Light Beam Output -->
    <polygon points="165,135 360,95 360,205 165,165" fill="url(#grad-led)"/>
    <line x1="165" y1="135" x2="360" y2="95" stroke="#10B981" class="ray-line"/>
    <line x1="165" y1="165" x2="360" y2="205" stroke="#10B981" class="ray-line"/>

    <!-- LED Component Graphic -->
    <circle cx="125" cy="150" r="20" fill="#34D399" opacity="0.3" filter="url(#glow-led)"/>
    <!-- Epoxy Dome -->
    <path d="M 100 150 L 100 135 A 25 25 0 0 1 150 135 L 150 150 Z" fill="#FFFFFF" fill-opacity="0.4" stroke="#4B5563" stroke-width="2" transform="rotate(90, 125, 150)"/>
    <line x1="100" y1="150" x2="150" y2="150" stroke="#4B5563" stroke-width="2"/>
    <!-- Leads / Anvil Structure Inside -->
    <path d="M 115 170 L 115 150 L 122 145" fill="none" stroke="#4B5563" stroke-width="1.5"/>
    <path d="M 135 170 L 135 142 L 128 145" fill="none" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Exterior Terminals -->
    <line x1="90" y1="142" x2="70" y2="142" stroke="#4B5563" stroke-width="2"/>
    <line x1="90" y1="158" x2="75" y2="158" stroke="#4B5563" stroke-width="2"/>

    <!-- Specifications Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="spec-text"><tspan class="spec-bold">Spectral Range:</tspan> 400 nm – 800 nm (Discrete bands / White)</text>
      <text x="0" y="20" class="spec-text"><tspan class="spec-bold">Region Covered:</tspan> Visible Spectral Range</text>
      <text x="0" y="40" class="spec-text"><tspan class="spec-bold">Mechanism:</tspan> Solid-State Injection Electroluminescence</text>
      <text x="0" y="60" class="spec-text"><tspan class="spec-bold">Key Trait:</tspan> Zero warm-up time, low power consumption, compact</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. XENON ARC LAMP (Bottom Right) -->
  <!-- ========================================================================= -->
  <g transform="translate(500, 420)">
    <rect width="410" height="300" class="section-bg"/>
    <text x="20" y="35" class="lamp-title">4. Xenon Arc Lamp</text>
    
    <!-- Intense Xenon Beam Output -->
    <polygon points="180,142 360,95 360,205 180,158" fill="url(#grad-xenon)"/>
    <line x1="180" y1="142" x2="360" y2="95" stroke="#06B6D4" class="ray-line"/>
    <line x1="180" y1="158" x2="360" y2="205" stroke="#06B6D4" class="ray-line"/>

    <!-- Lamp Graphic Structure -->
    <circle cx="130" cy="150" r="30" fill="#22D3EE" opacity="0.3" filter="url(#glow-xenon)"/>
    <!-- Quartz Envelope Bulb Structure -->
    <ellipse cx="130" cy="150" rx="35" ry="25" fill="#FFFFFF" fill-opacity="0.4" stroke="#4B5563" stroke-width="2"/>
    <!-- Electrodes inside Xenon Lamp -->
    <path d="M 95 150 L 115 150" stroke="#4B5563" stroke-width="2.5"/>
    <path d="M 165 150 L 145 150" stroke="#4B5563" stroke-width="2.5"/>
    <!-- Intense Arc Spark at center -->
    <circle cx="130" cy="150" r="5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>

    <!-- Specifications Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="spec-text"><tspan class="spec-bold">Spectral Range:</tspan> 190 nm – 1100 nm (Continuous)</text>
      <text x="0" y="20" class="spec-text"><tspan class="spec-bold">Region Covered:</tspan> UV, Visible, and Near-IR (Full Spectrum)</text>
      <text x="0" y="40" class="spec-text"><tspan class="spec-bold">Mechanism:</tspan> High-Pressure Xenon Gas Electrical Arc Discharge</text>
      <text x="0" y="60" class="spec-text"><tspan class="spec-bold">Key Trait:</tspan> Intense continuous spectrum across both UV &amp; Vis</text>
    </g>
  </g>

</svg>
