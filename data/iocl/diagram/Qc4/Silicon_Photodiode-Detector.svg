<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 580" width="100%" height="100%">
  <!-- Definitions for Gradients, Glows, and Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A5568" />
    </marker>
    <marker id="light-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D69E2E" />
    </marker>

    <!-- Gradients for P and N regions -->
    <linearGradient id="pRegionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="nRegionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="depletionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>
  </defs>

  <style>
    .text-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1E3A8A; }
    .text-subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #4B5563; font-style: italic; }
    .text-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1F2937; }
    .text-sub { font-size: 11px; fill: #4B5563; font-weight: normal; }
    .text-bold { font-weight: bold; }
    .wire { fill: none; stroke: #374151; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .sign-plus { fill: #1D4ED8; font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; }
    .sign-minus { fill: #B91C1C; font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; }
  </style>

  <!-- Background Canvas Accent -->
  <rect width="850" height="580" fill="#FBFBFB" rx="12"/>

  <!-- Main Title -->
  <text x="425" y="40" class="text-title" text-anchor="middle">Silicon Photodiode Detector</text>
  <text x="425" y="60" class="text-subtitle" text-anchor="middle">(Semiconductor / Solid-State Diode Detector)</text>

  <!-- ================= LIGHT / PHOTON INCOMING ================= -->
  <g id="incoming-light">
    <path d="M 285 75 Q 295 100 285 125 L 295 150" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#light-arrow)" />
    <path d="M 315 75 Q 325 100 315 125 L 325 150" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#light-arrow)" />
    <path d="M 345 75 Q 355 100 345 125 L 355 150" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#light-arrow)" />
    <text x="315" y="65" class="text-label text-bold" fill="#D97706" text-anchor="middle">Light Energy (hν)</text>
  </g>


  <!-- ================= DIODE STRUCTURE (P-N JUNCTION) ================= -->
  
  <!-- P-Region -->
  <rect x="160" y="160" width="130" height="140" fill="url(#pRegionGrad)" stroke="#2563EB" stroke-width="2" />
  <text x="225" y="185" class="text-label text-bold" fill="#1E3A8A" text-anchor="middle">P - Region</text>
  <!-- Holes (+) inside P-Region -->
  <text x="185" y="220" class="sign-plus">+</text> <text x="225" y="220" class="sign-plus">+</text> <text x="265" y="220" class="sign-plus">+</text>
  <text x="185" y="255" class="sign-plus">+</text> <text x="225" y="255" class="sign-plus">+</text> <text x="265" y="255" class="sign-plus">+</text>
  <text x="185" y="285" class="sign-plus">+</text> <text x="225" y="285" class="sign-plus">+</text> <text x="265" y="285" class="sign-plus">+</text>

  <!-- Depletion Layer (Middle Thin Zone) -->
  <rect x="290" y="160" width="50" height="140" fill="url(#depletionGrad)" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Minimal ions in depletion layer -->
  <text x="300" y="230" class="sign-minus" font-size="12">-</text>
  <text x="325" y="230" class="sign-plus" font-size="12">+</text>
  <text x="300" y="260" class="sign-minus" font-size="12">-</text>
  <text x="325" y="260" class="sign-plus" font-size="12">+</text>

  <!-- N-Region -->
  <rect x="340" y="160" width="130" height="140" fill="url(#nRegionGrad)" stroke="#DC2626" stroke-width="2" />
  <text x="405" y="185" class="text-label text-bold" fill="#991B1B" text-anchor="middle">N - Region</text>
  <!-- Electrons (-) inside N-Region -->
  <text x="365" y="220" class="sign-minus">-</text> <text x="405" y="220" class="sign-minus">-</text> <text x="445" y="220" class="sign-minus">-</text>
  <text x="365" y="255" class="sign-minus">-</text> <text x="405" y="255" class="sign-minus">-</text> <text x="445" y="255" class="sign-minus">-</text>
  <text x="365" y="285" class="sign-minus">-</text> <text x="405" y="285" class="sign-minus">-</text> <text x="445" y="285" class="sign-minus">-</text>


  <!-- ================= EXTERNAL BIASING CIRCUIT (REVERSE BIAS) ================= -->
  
  <!-- Left Connection (Anode to Negative Terminal) -->
  <path d="M 160 230 L 100 230 L 100 420 L 280 420" class="wire" />
  <text x="115" y="220" class="text-label" fill="#2563EB">Anode</text>

  <!-- Right Connection (Cathode to Positive Terminal) -->
  <path d="M 470 230 L 530 230 L 530 420 L 340 420" class="wire" />
  <text x="515" y="220" class="text-label" fill="#DC2626" text-anchor="end">Cathode</text>

  <!-- DC Power Source (Reverse Bias Setup) -->
  <!-- Negative Plate (Longer or connected to P) -->
  <line x1="280" y1="405" x2="280" y2="435" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />
  <text x="270" y="395" class="text-label text-bold" fill="#DC2626">-</text>
  
  <!-- Positive Plate (Thicker/Shorter or connected to N) -->
  <line x1="295" y1="412" x2="295" y2="428" stroke="#2563EB" stroke-width="6" stroke-linecap="round" />
  <line x1="310" y1="405" x2="310" y2="435" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />
  <line x1="325" y1="412" x2="325" y2="428" stroke="#2563EB" stroke-width="6" stroke-linecap="round" />
  <line x1="340" y1="405" x2="340" y2="435" stroke="#DC2626" stroke-width="4" stroke-linecap="round" />
  <text x="345" y="395" class="text-label text-bold" fill="#2563EB">+</text>

  <text x="310" y="465" class="text-label text-bold" text-anchor="middle">Reverse Bias Mode</text>


  <!-- ================= LABELS & POINTER LINES ================= -->
  
  <!-- Depletion Layer Label -->
  <path d="M 315 305 L 315 360 L 250 360" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#arrow)" />
  <text x="240" y="364" class="text-label" text-anchor="end">Depletion Layer</text>

  <!-- Charge Carriers Key -->
  <g id="key-carriers" transform="translate(80, 480)">
    <circle cx="20" cy="15" r="6" fill="none" stroke="#1D4ED8" stroke-width="2"/>
    <text x="35" y="20" class="text-label text-sub"> = Holes (+)</text>
    
    <circle cx="140" cy="15" r="6" fill="#B91C1C"/>
    <text x="155" y="20" class="text-label text-sub"> = Electrons (-)</text>
  </g>


  <!-- ================= CONCEPT GRAPH (RIGHT SIDE) ================= -->
  <g id="concept-graph" transform="translate(580, 240)">
    <!-- Graph Background -->
    <rect x="-10" y="-80" width="220" height="250" fill="#F3F4F6" rx="8" stroke="#E5E7EB" />
    
    <!-- Axes -->
    <line x1="20" y1="120" x2="190" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" /> <!-- X Axis -->
    <line x1="20" y1="120" x2="20" y2="-40" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />  <!-- Y Axis -->
    
    <!-- Axis Labels -->
    <text x="105" y="145" class="text-label text-sub text-bold" text-anchor="middle">Light Intensity</text>
    <text x="-40" y="40" class="text-label text-sub text-bold" text-anchor="middle" transform="rotate(-90, -40, 40)">Current Flow (I)</text>
    
    <!-- Proportional Linear Curve -->
    <line x1="20" y1="120" x2="160" y2="-10" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    
    <!-- Graph Title/Conclusion -->
    <text x="105" y="-60" class="text-label" fill="#059669" text-anchor="middle">Intensity ∝ Current</text>
  </g>

</svg>
